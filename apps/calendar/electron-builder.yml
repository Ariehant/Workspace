# Workspace Calendar packages: Linux (.deb and AppImage, Ubuntu 24.04 and later) and Windows
# (NSIS installer). Build with `pnpm package:linux` or `pnpm package:win` (on Windows).
appId: io.github.ariehant.workspace-calendar
productName: Workspace Calendar
executableName: workspace-calendar
copyright: Copyright © Workspace Maintainers

directories:
  output: dist
  buildResources: build

# The main, preload and renderer bundles contain all JavaScript dependencies, so no
# node_modules are shipped. SQLite comes from Electron's built-in node:sqlite.
files:
  - out/**
  - package.json
asar: true

linux:
  target:
    - deb
    - AppImage
  icon: build/icon.png
  category: Office
  synopsis: A calendar for Workspace's dated database rows
  description: >-
    A fast, keyboard-first desktop calendar that shows and edits the dated rows of Workspace
    databases (tasks, meetings, deadlines) through the Workspace server's API, with
    notifications and a tray icon.
  maintainer: Workspace Maintainers <maintainers@example.invalid>
  vendor: Workspace Maintainers
  # Electron reports desktopName (package.json) as the Wayland app_id / X11 WM_CLASS,
  # so the dock links running windows to this launcher.
  syncDesktopName: true
  desktop:
    entry:
      Comment: Your Workspace dates, on a calendar
      Keywords: calendar;events;agenda;schedule;workspace;

deb:
  packageName: workspace-calendar
  packageCategory: utils
  artifactName: workspace-calendar_${version}_${arch}.${ext}
  # Ubuntu 24.04 renamed several libraries with a t64 suffix; accept either name.
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
  # The tray icon on GNOME needs the AppIndicator extension (Ubuntu ships it).
  recommends:
    - gnome-shell-extension-appindicator

appImage:
  artifactName: Workspace-Calendar-${version}-${arch}.AppImage

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  artifactName: Workspace-Calendar-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  shortcutName: Workspace Calendar
