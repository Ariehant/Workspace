# Linux packages for Ubuntu 24.04 and later (`pnpm package`), and a Windows installer
# (`pnpm --filter @workspace/desktop package:win`, on Windows).
appId: io.github.ariehant.workspace
productName: Workspace
executableName: workspace-app
copyright: Copyright © Workspace Maintainers

directories:
  output: dist
  buildResources: build

# The main, preload and renderer bundles contain all JavaScript dependencies, so no
# node_modules are shipped. SQLite comes from Electron's built-in node:sqlite.
files:
  - out/**
  - package.json
asar: true

# Lets the desktop open workspace://page/… links (adds the MIME type to the .desktop file).
protocols:
  - name: Workspace link
    schemes:
      - workspace

linux:
  target:
    - deb
    - AppImage
  icon: build/icon.png
  category: Office
  synopsis: Offline-first workspace for notes, docs and databases
  description: >-
    Pages, databases and rich text, stored locally in SQLite and usable fully offline,
    with an optional self-hosted server for sync, collaboration and a Notion-compatible API.
  maintainer: Workspace Maintainers <maintainers@example.invalid>
  vendor: Workspace Maintainers
  # Electron reports desktopName (package.json) as the Wayland app_id / X11 WM_CLASS,
  # so the dock links running windows to this launcher.
  syncDesktopName: true
  desktop:
    entry:
      Comment: Notes, docs and wikis that work offline
      Keywords: notes;wiki;docs;knowledge;

deb:
  packageName: workspace-app
  packageCategory: editors
  artifactName: workspace-app_${version}_${arch}.${ext}
  # Ubuntu 24.04 renamed several libraries with a t64 suffix; accept either name.
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2

appImage:
  artifactName: ${productName}-${version}-${arch}.AppImage

# Windows 10 and 11 (x64): a per-user installer that needs no administrator rights, with a Start
# menu shortcut. The app registers workspace:// links itself when it starts.
win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  shortcutName: Workspace

# The Snap Store build (`--linux snap`, in the release workflow). Strict confinement: the
# home folder, the network, the desktop, sound, the keyring (sync's session token) and
# removable drives (exports, imports).
snap:
  artifactName: workspace-app_${version}_${arch}.snap
  confinement: strict
  grade: stable
  summary: Notes, docs and databases that work offline
  plugs:
    - default
    - home
    - network
    - removable-media
    - password-manager-service
    - audio-playback

# The Flathub build (`--linux flatpak`, in the release workflow), on the Electron base app.
flatpak:
  artifactName: ${productName}-${version}-${arch}.flatpak
  runtime: org.freedesktop.Platform
  runtimeVersion: '24.08'
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: '24.08'
  finishArgs:
    - --share=ipc
    - --share=network
    - --socket=x11
    - --socket=wayland
    - --socket=pulseaudio
    - --device=dri
    - --filesystem=home
    - --talk-name=org.freedesktop.Notifications
    - --talk-name=org.freedesktop.secrets

# Where the AppImage looks for updates (electron-updater; the release workflow uploads
# latest-linux.yml with each release). Nothing is uploaded from a local `pnpm package`.
publish:
  provider: github
  owner: ariehant
  repo: workspace
  releaseType: release
