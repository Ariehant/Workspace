# Linux packages for Ubuntu 24.04 and later. Build with `pnpm package`.
appId: io.github.ariehant.workspace
productName: Workspace
executableName: workspace-app
copyright: Copyright © Workspace Maintainers

directories:
  output: dist
  buildResources: build

# The main, preload and renderer bundles contain all JavaScript dependencies, so no
# node_modules are shipped. SQLite comes from Electron's built-in node:sqlite.
files:
  - out/**
  - package.json
asar: true

# Lets the desktop open workspace://page/… links (adds the MIME type to the .desktop file).
protocols:
  - name: Workspace link
    schemes:
      - workspace

linux:
  target:
    - deb
    - AppImage
  icon: build/icon.png
  category: Office
  synopsis: Offline-first workspace for notes, docs and databases
  description: >-
    Pages, databases and rich text, stored locally in SQLite and usable fully offline,
    with an optional self-hosted server for sync, collaboration and a Notion-compatible API.
  maintainer: Workspace Maintainers <maintainers@example.invalid>
  vendor: Workspace Maintainers
  # Electron reports desktopName (package.json) as the Wayland app_id / X11 WM_CLASS,
  # so the dock links running windows to this launcher.
  syncDesktopName: true
  desktop:
    entry:
      Comment: Notes, docs and wikis that work offline
      Keywords: notes;wiki;docs;knowledge;

deb:
  packageName: workspace-app
  packageCategory: editors
  artifactName: workspace-app_${version}_${arch}.${ext}
  # Ubuntu 24.04 renamed several libraries with a t64 suffix; accept either name.
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2

appImage:
  artifactName: ${productName}-${version}-${arch}.AppImage
