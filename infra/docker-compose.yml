# Workspace sync server: `docker compose --env-file .env up -d` (see .env.example).
name: workspace

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: workspace-server:latest
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN}
      DATABASE_URL: postgres://workspace:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/workspace
      # Attachments on a volume; see docker-compose.s3.yml for S3 (SeaweedFS, MinIO, AWS...).
      FILES_DRIVER: fs
      FILES_DIR: /data/files
      SIGNUP: ${SIGNUP:-invite}
      MAX_FILE_MB: ${MAX_FILE_MB:-512}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - server-files:/data/files
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: workspace
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workspace -d workspace']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  server-files:
