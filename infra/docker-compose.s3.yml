# Attachments in S3 instead of a volume:
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml --env-file .env up -d
# This bundles SeaweedFS's S3 gateway. To use another S3 (MinIO, AWS, Backblaze...),
# drop the seaweedfs service and set S3_ENDPOINT / S3_REGION / keys in .env.
services:
  server:
    environment:
      FILES_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-workspace-files}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    depends_on:
      seaweedfs:
        condition: service_started

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    # One-node SeaweedFS with its S3 API on 8333; the keys come from .env.
    entrypoint: >
      /bin/sh -c 'printf "{\"identities\":[{\"name\":\"workspace\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}" "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
      && exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0'
    volumes:
      - seaweedfs-data:/data

volumes:
  seaweedfs-data:
