name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end (Electron)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, which
      # Chromium's sandbox needs. The .deb ships an AppArmor profile for this; the
      # unpackaged Electron binary used here has none, so lift the restriction.
      - name: Allow user namespaces for the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter @workspace/desktop build
      # The sync tests serve the web app and drive it in Chromium too.
      - run: pnpm --filter @workspace/web build
      - run: pnpm --filter @workspace/web exec playwright install --with-deps chromium
      - run: xvfb-run -a pnpm test:e2e
      - name: Web app end-to-end (Chromium)
        run: pnpm test:e2e:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  e2e-calendar:
    name: End-to-end (Calendar)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # As in the e2e job: Chromium's sandbox needs unprivileged user namespaces.
      - name: Allow user namespaces for the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter @workspace/calendar build
      # The tests start a real Workspace server (built from apps/server, on a throwaway
      # Postgres from the runner's PostgreSQL).
      - run: xvfb-run -a pnpm --filter @workspace/calendar test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-calendar
          path: |
            apps/calendar/playwright-report
            apps/calendar/test-results
          retention-days: 7

  perf:
    name: Performance budgets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Allow user namespaces for the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter @workspace/desktop build
      # The base branch's last results, for the regression check (none on a first run).
      - uses: actions/cache/restore@v4
        with:
          path: perf-baseline.json
          key: perf-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: perf-${{ github.base_ref || github.ref_name }}-
      - name: Pure-code benchmarks (50,000 rows)
        run: pnpm --filter @workspace/perf bench
        env:
          PERF_RESULTS: ${{ github.workspace }}/perf-results.json
      - name: UI budgets (10,000-block page, 50,000-row database)
        working-directory: apps/desktop
        run: xvfb-run -a npx playwright test e2e/perf.spec.ts
        env:
          PERF: 1
          PERF_RESULTS: ${{ github.workspace }}/perf-results.json
      - name: Compare with the budgets and the base branch
        if: always()
        run: node --experimental-strip-types packages/perf/src/report.ts perf-results.json perf-baseline.json
      # Every run on main becomes the next baseline, passed or not: saving only on a pass kept a
      # fast runner's results as the baseline for good, and every slower runner after it failed.
      - name: Keep these results as the baseline
        if: always() && github.event_name == 'push' && hashFiles('perf-results.json') != ''
        run: cp perf-results.json perf-baseline.json
      - uses: actions/cache/save@v4
        if: always() && github.event_name == 'push' && hashFiles('perf-results.json') != ''
        with:
          path: perf-baseline.json
          key: perf-${{ github.ref_name }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results.json
          retention-days: 30

  package:
    name: Package and install on Ubuntu 24.04
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      # Install the .deb the way a user would, then launch the installed app with the
      # Chromium sandbox on (relying on the AppArmor profile the package installs).
      - name: Install .deb
        run: sudo apt-get install -y ./apps/desktop/dist/workspace-app_*_amd64.deb
      - name: Smoke-test installed app
        run: xvfb-run -a workspace-app --smoke-test
      - name: Smoke-test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          chmod +x apps/desktop/dist/*.AppImage
          xvfb-run -a apps/desktop/dist/*.AppImage --no-sandbox --smoke-test
      - name: The AppImage updates itself (this version to the next, from a local feed)
        run: bash scripts/test-appimage-update.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.AppImage
          retention-days: 14

  package-calendar:
    name: Package the calendar (Linux)
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/calendar package:linux
      # Install the .deb the way a user would, then launch the installed app with the
      # Chromium sandbox on (relying on the AppArmor profile the package installs).
      - name: Install .deb
        run: sudo apt-get install -y ./apps/calendar/dist/workspace-calendar_*_amd64.deb
      - name: Smoke-test installed app
        run: xvfb-run -a workspace-calendar --smoke-test
      - name: Smoke-test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          chmod +x apps/calendar/dist/*.AppImage
          xvfb-run -a apps/calendar/dist/*.AppImage --no-sandbox --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-linux-packages
          path: |
            apps/calendar/dist/*.deb
            apps/calendar/dist/*.AppImage
          retention-days: 14

  package-calendar-windows:
    name: Package the calendar (Windows)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/calendar package:win
      # The app is a GUI program: wait for it, and check how it ended.
      - name: Smoke-test the app
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "apps/calendar/dist/win-unpacked/workspace-calendar.exe" `
            -ArgumentList '--smoke-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "The smoke test failed (exit code $($app.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-windows-installer
          path: apps/calendar/dist/*.exe
          retention-days: 14

  server:
    name: Server image and Compose stack
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the server image
        run: docker build -f apps/server/Dockerfile -t workspace-server:latest .
      - name: Start the stack (attachments in S3 via SeaweedFS)
        working-directory: infra
        run: |
          printf 'DOMAIN=localhost\nSIGNUP=open\nPOSTGRES_PASSWORD=ci-password\nS3_ACCESS_KEY_ID=workspace\nS3_SECRET_ACCESS_KEY=ci-secret-key\n' > .env
          docker compose -f docker-compose.yml -f docker-compose.s3.yml -f docker-compose.ci.yml up -d --no-build --wait
      - name: Smoke-test through Caddy (HTTPS)
        run: |
          for i in $(seq 1 30); do curl -skf https://localhost/api/ready && break; sleep 2; done
          curl -skf https://localhost/api/ready | grep '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/health)" = 308
      - name: Admin CLI
        working-directory: infra
        run: docker compose -f docker-compose.yml -f docker-compose.s3.yml exec -T server workspace-admin migrate
      # Two devices sign up, sync over wss, store an attachment in S3 and search,
      # trusting Caddy's local CA.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stack end to end (sync, files, search, web app, API, forms, webhooks)
        run: |
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.s3.yml cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"
          STACK_URL=https://localhost NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/caddy-root.crt" STACK_WEBHOOK_HOST=host.docker.internal \
            pnpm --filter @workspace/server exec vitest run src/stack.smoke.test.ts
      - name: Logs
        if: failure()
        working-directory: infra
        run: docker compose -f docker-compose.yml -f docker-compose.s3.yml logs

  # The latest build of main, as a pre-release anyone can download without building: the .deb
  # and AppImage the package job built and smoke-tested, published after the tests pass and
  # replaced on every push to main. Until there are real releases. (Its tag isn't a version, so
  # the Release workflow doesn't run for it.)
  latest-build:
    name: Publish the latest build (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, package, server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: latest-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: packages
      - name: Checksums
        working-directory: packages
        run: sha256sum *.deb *.AppImage > SHA256SUMS
      - name: The latest-build pre-release
        run: |
          set -euo pipefail
          title="Latest build (main, ${GITHUB_SHA::7})"
          printf 'A development build of `main` at %s, published by CI after its tests passed.\n\n' "$GITHUB_SHA" > notes.md
          cat >> notes.md <<'EOF'
          It's replaced whenever `main` changes. It isn't signed, and it doesn't update itself:
          install a newer one the same way (or a release, once there is one).

          **Install** (Ubuntu 24.04 or later): download the `.deb` below, then
          `sudo apt install ~/Downloads/workspace-app_*_amd64.deb`. Or the AppImage: make it
          executable (`chmod +x Workspace-*.AppImage`) and run it.

          Check a download against `SHA256SUMS`.
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Move the tag to this commit, replace the files, drop ones this build doesn't have
            # (a new version renames them), then the title and notes.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload "$TAG" packages/* --clobber
            keep="$(ls packages)"
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              grep -qxF "$asset" <<< "$keep" || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release edit "$TAG" --title "$title" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" packages/* --target "$GITHUB_SHA" --prerelease \
              --title "$title" --notes-file notes.md
          fi
