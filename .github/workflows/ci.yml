name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end (Electron)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, which
      # Chromium's sandbox needs. The .deb ships an AppArmor profile for this; the
      # unpackaged Electron binary used here has none, so lift the restriction.
      - name: Allow user namespaces for the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter @workspace/desktop build
      # The sync tests serve the web app and drive it in Chromium too.
      - run: pnpm --filter @workspace/web build
      - run: pnpm --filter @workspace/web exec playwright install --with-deps chromium
      - run: xvfb-run -a pnpm test:e2e
      - name: Web app end-to-end (Chromium)
        run: pnpm test:e2e:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  package:
    name: Package and install on Ubuntu 24.04
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      # Install the .deb the way a user would, then launch the installed app with the
      # Chromium sandbox on (relying on the AppArmor profile the package installs).
      - name: Install .deb
        run: sudo apt-get install -y ./apps/desktop/dist/workspace-app_*_amd64.deb
      - name: Smoke-test installed app
        run: xvfb-run -a workspace-app --smoke-test
      - name: Smoke-test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          chmod +x apps/desktop/dist/*.AppImage
          xvfb-run -a apps/desktop/dist/*.AppImage --no-sandbox --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.AppImage
          retention-days: 14

  server:
    name: Server image and Compose stack
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the server image
        run: docker build -f apps/server/Dockerfile -t workspace-server:latest .
      - name: Start the stack (attachments in S3 via SeaweedFS)
        working-directory: infra
        run: |
          printf 'DOMAIN=localhost\nSIGNUP=open\nPOSTGRES_PASSWORD=ci-password\nS3_ACCESS_KEY_ID=workspace\nS3_SECRET_ACCESS_KEY=ci-secret-key\n' > .env
          docker compose -f docker-compose.yml -f docker-compose.s3.yml up -d --no-build --wait
      - name: Smoke-test through Caddy (HTTPS)
        run: |
          for i in $(seq 1 30); do curl -skf https://localhost/api/ready && break; sleep 2; done
          curl -skf https://localhost/api/ready | grep '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/health)" = 308
      - name: Admin CLI
        working-directory: infra
        run: docker compose -f docker-compose.yml -f docker-compose.s3.yml exec -T server workspace-admin migrate
      - name: Logs
        if: failure()
        working-directory: infra
        run: docker compose -f docker-compose.yml -f docker-compose.s3.yml logs
