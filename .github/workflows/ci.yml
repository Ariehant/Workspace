name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end (Electron)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, which
      # Chromium's sandbox needs. The .deb ships an AppArmor profile for this; the
      # unpackaged Electron binary used here has none, so lift the restriction.
      - name: Allow user namespaces for the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter @workspace/desktop build
      - run: xvfb-run -a pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7

  package:
    name: Package and install on Ubuntu 24.04
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      # Install the .deb the way a user would, then launch the installed app with the
      # Chromium sandbox on (relying on the AppArmor profile the package installs).
      - name: Install .deb
        run: sudo apt-get install -y ./apps/desktop/dist/workspace-app_*_amd64.deb
      - name: Smoke-test installed app
        run: xvfb-run -a workspace-app --smoke-test
      - name: Smoke-test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          chmod +x apps/desktop/dist/*.AppImage
          xvfb-run -a apps/desktop/dist/*.AppImage --no-sandbox --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.AppImage
          retention-days: 14
